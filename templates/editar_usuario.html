{% extends "base.html" %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="col-lg-7 mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 fs-5"><i class="bi bi-pencil-square me-2"></i>Editar Usuário</h4>
            </div>
            <div class="card-body p-4">
                {% include '_flash_messages.html' %}
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nome de Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ usuario.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="papel" class="form-label">Papel / Permissão</label>
                        <select name="papel" id="papel" class="form-select">
                            <option value="normal" {% if usuario.papel == 'normal' %}selected{% endif %}>Normal</option>
                            <option value="admin" {% if usuario.papel == 'admin' %}selected{% endif %}>Administrador</option>
                        </select>
                    </div>
                    <hr class="my-4">
                    <div class="mb-3">
                        <label for="nova_senha" class="form-label">Nova Senha (Opcional)</label>
                        <input type="password" class="form-control" id="nova_senha" name="nova_senha" placeholder="Deixe em branco para não alterar">
                        <div class="form-text">Preencha apenas se desejar alterar a senha. Mínimo de 6 caracteres.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a href="{{ url_for('listar_usuarios') }}" class="btn btn-light border">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save-fill me-1"></i>Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
