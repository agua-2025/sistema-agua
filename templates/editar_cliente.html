<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Cliente | Águas de Santa Maria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script src="https://unpkg.com/imask"></script>
    <style>
      body {
        background-color: #f4f7f9;
        font-family: "Inter", sans-serif;
      }
      .form-container {
        max-width: 800px;
        margin: 2rem auto;
        background: #fff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
      }
      .cpf-feedback {
        font-size: 0.875em;
        margin-top: 0.25rem;
        display: none;
      }
      .cpf-feedback.is-valid {
        color: #198754;
        display: block;
      }
      .cpf-feedback.is-invalid {
        color: #dc3545;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <div
          class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3"
        >
          <h3 class="text-primary mb-0">
            <i class="bi bi-pencil-square me-2"></i> Editar Dados do Cliente
          </h3>
          <a href="{{ next_url or url_for('detalhes_cliente', cliente_id=cliente.id) }}" ...>
        </div>

        {% include '_flash_messages.html' %}

        <form method="POST">
          <h5 class="mb-3 pb-2">
            <i class="bi bi-person-lines-fill me-2 text-muted"></i>Dados
            Pessoais
          </h5>
          <div class="row g-3">
            <div class="col-12">
              <label for="nome" class="form-label"
                >Nome Completo <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="nome"
                name="nome"
                value="{{ cliente.nome }}"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="cpf" class="form-label"
                >CPF <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="cpf"
                name="cpf"
                value="{{ cliente.cpf or '' }}"
                inputmode="numeric"
                required
              />
              <div id="cpf-feedback" class="cpf-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="rg" class="form-label">RG</label>
              <input
                type="text"
                class="form-control"
                id="rg"
                name="rg"
                value="{{ cliente.rg or '' }}"
                inputmode="numeric"
              />
            </div>
            <div class="col-md-6">
              <label for="telefone" class="form-label"
                >Telefone <span class="text-danger">*</span></label
              >
              <input
                type="tel"
                class="form-control"
                id="telefone"
                name="telefone"
                value="{{ cliente.telefone or '' }}"
                inputmode="numeric"
                required
              />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
           <a href="{{ next_url or url_for('detalhes_cliente', cliente_id=cliente.id) }}" ...>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save-fill me-1"></i> Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Script de validação e máscaras (idêntico ao do cadastro)
      function validaCPF(cpf) {
        cpf = String(cpf).replace(/[^\d]/g, "");
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
        let soma = 0,
          resto;
        for (let i = 1; i <= 9; i++)
          soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf.substring(9, 10))) return false;
        soma = 0;
        for (let i = 1; i <= 10; i++)
          soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf.substring(10, 11))) return false;
        return true;
      }
      document.addEventListener("DOMContentLoaded", function () {
        const cpfInput = document.getElementById("cpf");
        const cpfFeedback = document.getElementById("cpf-feedback");
        if (cpfInput) {
          const cpfMask = IMask(cpfInput, { mask: "000.000.000-00" });
          const checkCpf = () => {
            const cpfValue = cpfMask.unmaskedValue;
            if (!cpfValue) {
              cpfFeedback.textContent = "";
              cpfFeedback.className = "cpf-feedback";
              cpfInput.classList.remove("is-valid", "is-invalid");
              return;
            }
            if (cpfValue.length === 11) {
              if (validaCPF(cpfValue)) {
                cpfFeedback.textContent = "CPF válido!";
                cpfFeedback.className = "cpf-feedback is-valid";
                cpfInput.classList.remove("is-invalid");
                cpfInput.classList.add("is-valid");
              } else {
                cpfFeedback.textContent = "CPF inválido!";
                cpfFeedback.className = "cpf-feedback is-invalid";
                cpfInput.classList.remove("is-valid");
                cpfInput.classList.add("is-invalid");
              }
            } else {
              cpfFeedback.textContent = "CPF incompleto.";
              cpfFeedback.className = "cpf-feedback is-invalid";
              cpfInput.classList.remove("is-valid");
              cpfInput.classList.add("is-invalid");
            }
          };
          cpfInput.addEventListener("blur", checkCpf);
          checkCpf();
        }
        const telefoneInput = document.getElementById("telefone");
        if (telefoneInput) {
          const telefoneMask = IMask(telefoneInput, {
            mask: [{ mask: "(00) 0000-0000" }, { mask: "(00) 00000-0000" }],
          });
        }
      });
    </script>
  </body>
</html>
