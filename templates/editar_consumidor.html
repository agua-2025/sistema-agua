<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Consumidor | Águas de Santa Maria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/imask"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f4f7f9;
      }
      .form-container {
        background-color: #ffffff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
        margin: 2rem auto;
        max-width: 800px;
      }
      .form-label {
        font-weight: 500;
        color: #495057;
      }
      .form-control[readonly] {
        background-color: #e9ecef;
        cursor: not-allowed;
      }
      /* --- CSS ADICIONADO PARA VALIDAÇÃO DO CPF --- */
      .cpf-feedback {
        font-size: 0.875em;
        margin-top: 0.25rem;
        display: none; /* Começa escondido */
      }
      .cpf-feedback.is-valid {
        color: #198754;
        display: block;
      }
      .cpf-feedback.is-invalid {
        color: #dc3545;
        display: block;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="form-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="text-primary m-0">
            <i class="bi bi-pencil-square me-2"></i> Editar Consumidor
          </h3>
          <a
            href="{{ url_for('listar_consumidores') }}"
            class="btn btn-outline-secondary"
          >
            <i class="bi bi-arrow-left me-1"></i> Voltar
          </a>
        </div>

        {% include '_flash_messages.html' %}

        <form method="POST">
          <h5 class="mb-3 border-bottom pb-2">
            <i class="bi bi-person-lines-fill me-2 text-muted"></i>Dados
            Pessoais
          </h5>
          <div class="row g-3 mb-4">
            <div class="col-md-12">
              <label for="nome" class="form-label"
                >Nome Completo <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="nome"
                name="nome"
                value="{{ consumidor.nome }}"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="cpf" class="form-label"
                >CPF <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="cpf"
                name="cpf"
                value="{{ consumidor.cpf or '' }}"
                inputmode="numeric"
                required
              />
              <div id="cpf-feedback" class="cpf-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="rg" class="form-label">RG</label>
              <input
                type="text"
                class="form-control"
                id="rg"
                name="rg"
                value="{{ consumidor.rg or '' }}"
                inputmode="numeric"
              />
            </div>
            <div class="col-md-6">
              <label for="telefone" class="form-label"
                >Telefone <span class="text-danger">*</span></label
              >
              <input
                type="tel"
                class="form-control"
                id="telefone"
                name="telefone"
                value="{{ consumidor.telefone or '' }}"
                inputmode="numeric"
                required
              />
            </div>
          </div>

          <h5 class="mb-3 border-bottom pb-2">
            <i class="bi bi-geo-alt-fill me-2 text-muted"></i>Dados de Endereço
            e Medição
          </h5>
          <div class="row g-3">
            <div class="col-md-12">
              <label for="endereco" class="form-label"
                >Endereço Completo <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="endereco"
                name="endereco"
                value="{{ consumidor.endereco }}"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="hidrometro" class="form-label"
                >Número do Hidrômetro <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="hidrometro"
                name="hidrometro"
                value="{{ consumidor.hidrometro_num }}"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="data_cadastro" class="form-label"
                >Data de Cadastro</label
              >
              <input
                type="text"
                class="form-control"
                id="data_cadastro"
                value="{{ consumidor.data_cadastro | date_format if consumidor.data_cadastro else 'N/A' }}"
                readonly
              />
            </div>
            <div class="col-md-6">
              <label for="leitura_inicial" class="form-label"
                >Leitura Inicial Registrada (m³)</label
              >
              <input
                type="text"
                class="form-control"
                id="leitura_inicial"
                value="{{ consumidor.leitura_inicial }}"
                readonly
              />
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <a
              href="{{ url_for('listar_consumidores') }}"
              class="btn btn-light border"
              >Cancelar</a
            >
            <button type="submit" class="btn btn-primary px-4 ms-2">
              <i class="bi bi-save-fill me-2"></i>Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Função de validação de CPF
      function validaCPF(cpf) {
        cpf = String(cpf).replace(/[^\d]/g, "");
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
        let soma = 0,
          resto;
        for (let i = 1; i <= 9; i++)
          soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf.substring(9, 10))) return false;
        soma = 0;
        for (let i = 1; i <= 10; i++)
          soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
        resto = (soma * 10) % 11;
        if (resto === 10 || resto === 11) resto = 0;
        if (resto !== parseInt(cpf.substring(10, 11))) return false;
        return true;
      }

      document.addEventListener("DOMContentLoaded", function () {
        const cpfInput = document.getElementById("cpf");
        const cpfFeedback = document.getElementById("cpf-feedback");

        if (cpfInput) {
          // Aplica a máscara de CPF
          const cpfMask = IMask(cpfInput, { mask: "000.000.000-00" });

          // Função para rodar a validação
          const checkCpf = () => {
            const cpfValue = cpfMask.unmaskedValue;
            if (!cpfValue) {
              // Se o campo estiver vazio
              cpfFeedback.textContent = "";
              cpfFeedback.className = "cpf-feedback";
              cpfInput.classList.remove("is-valid", "is-invalid");
              return;
            }
            if (cpfValue.length === 11) {
              if (validaCPF(cpfValue)) {
                cpfFeedback.textContent = "CPF válido!";
                cpfFeedback.className = "cpf-feedback is-valid";
                cpfInput.classList.remove("is-invalid");
                cpfInput.classList.add("is-valid");
              } else {
                cpfFeedback.textContent = "CPF inválido!";
                cpfFeedback.className = "cpf-feedback is-invalid";
                cpfInput.classList.remove("is-valid");
                cpfInput.classList.add("is-invalid");
              }
            } else {
              cpfFeedback.textContent = "CPF incompleto.";
              cpfFeedback.className = "cpf-feedback is-invalid";
              cpfInput.classList.remove("is-valid");
              cpfInput.classList.add("is-invalid");
            }
          };

          // Valida quando o usuário sai do campo
          cpfInput.addEventListener("blur", checkCpf);
          // Valida ao carregar a página para o valor que já está lá
          checkCpf();
        }

        // Máscara para o Telefone
        const telefoneInput = document.getElementById("telefone");
        if (telefoneInput) {
          const telefoneMask = IMask(telefoneInput, {
            mask: [{ mask: "(00) 0000-0000" }, { mask: "(00) 00000-0000" }],
          });
        }
      });
    </script>
  </body>
</html>
